name: Deploy Supabase function
# Deploys icell-send-push (the call push sender) when it changes, or on demand.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens). If it is missing this run only warns.
# The function's own secrets (FCM_SERVICE_ACCOUNT, PUSH_WEBHOOK_SECRET) live in Supabase > Edge Functions > Secrets, not here.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (the part before .supabase.co)'
        required: true
        default: hcfehacsfirzwjqqcabb
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project_ref || 'hcfehacsfirzwjqqcabb' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        id: tok
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Not deployed::Repository secret SUPABASE_ACCESS_TOKEN is missing, so icell-send-push was NOT deployed."
            echo "have=no" >> "$GITHUB_OUTPUT"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.have == 'yes'
        with:
          version: latest
      - name: Deploy icell-send-push (called by database triggers, checked by a shared secret)
        if: steps.tok.outputs.have == 'yes'
        run: |
          if ! supabase functions deploy icell-send-push --no-verify-jwt --project-ref "$PROJECT_REF" > deploy.log 2>&1; then
            msg=$(tail -25 deploy.log | sed -E 's/sbp_[A-Za-z0-9_]+/[token]/g' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Deploy failed::$msg"
            exit 1
          fi
          echo "Deployed icell-send-push"
