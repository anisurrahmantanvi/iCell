name: Android APK
# Builds on every push to main, and on demand (Actions > Android APK > Run workflow).
# The URL and the PUBLISHABLE key (public by design, same as iConnecto) come from, in order:
#   the manual inputs, then repository Variables VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY, then the defaults below.
# Never put a secret / service-role key here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Supabase project URL (optional, overrides the default)
        required: false
      publishable_key:
        description: Supabase publishable key (optional; never a secret / service-role key)
        required: false
concurrency:
  group: apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ inputs.supabase_url || vars.VITE_SUPABASE_URL || 'https://hcfehacsfirzwjqqcabb.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.publishable_key || vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_sSm3MgXAmUpwFaPdwgPvUA_TmTFjstu' }}
      - name: Add Capacitor (build-time only, package.json untouched)
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@6 @capacitor/android@6
      - name: Create the Android project (files are bundled in the APK)
        run: |
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.iconnecto.call","appName":"iCell","webDir":"dist","server":{"androidScheme":"https"}}
          JSON
          npx cap add android
          # iCell's own native code: lock-screen incoming-call notification, over-lock-screen launch, small helper plugin
          cp mobile/MainActivity.java mobile/CallMessagingService.java mobile/CallSetupPlugin.java android/app/src/main/java/com/iconnecto/call/
          python3 - <<'PY'
          import re
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'xmlns:tools' not in s:
              s=s.replace('<manifest ','<manifest xmlns:tools="http://schemas.android.com/tools" ',1)
          perms=''.join('<uses-permission android:name="android.permission.%s" />\n'%x for x in ['RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','POST_NOTIFICATIONS','USE_FULL_SCREEN_INTENT','VIBRATE','WAKE_LOCK'])
          s=s.replace('</manifest>',perms+'</manifest>')
          # our service handles every push for this app, so the push plugin's own service is removed
          svc='<service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n<service android:name=".CallMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>\n'
          s=s.replace('</application>',svc+'</application>')
          open(p,'w').write(s)
          PY
          npx cap sync android
      - name: Firebase config (needed for phone push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase config added"
          else
            echo "::warning title=No Firebase config::Repository secret GOOGLE_SERVICES_JSON is missing, so this APK cannot receive call pushes when closed."
          fi
      - name: Make Firebase Messaging visible to iCell's own service
        run: |
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          dep="dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.1.2')\n    implementation 'com.google.firebase:firebase-messaging'\n"
          assert 'dependencies {\n' in s
          s=s.replace('dependencies {\n',dep,1)
          open(p,'w').write(s)
          PY
      - name: Build debug APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1; then
            msg=$(grep -E "error:|What went wrong|Caused by|FAILURE|Could not|not found|Unsupported|Execution failed" -A3 ../gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: icell-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on a separate branch
        run: |
          mkdir /tmp/pub && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/pub/iCell.apk && cd /tmp/pub
          git init -q -b built-apk
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "APK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" built-apk
