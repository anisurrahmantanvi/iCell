<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1417" />
    <title>Get iCell for Android</title>
    <style>
      :root { color-scheme: dark light; --bg:#0f1417; --surface:#182025; --line:#26323a; --text:#eaf1f4; --muted:#8ea0aa; --accent:#3ddc97; --ink:#062014; }
      @media (prefers-color-scheme: light) { :root { --bg:#f4f8f6; --surface:#fff; --line:#dbe5e0; --text:#10201a; --muted:#5d6f67; --accent:#12a66a; --ink:#fff; } }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Bengali',sans-serif; }
      main { width:100%; max-width:420px; display:grid; gap:14px; text-align:center; justify-items:center; }
      .mark { width:72px; height:72px; border-radius:22px; display:grid; place-items:center; background:var(--accent); color:var(--ink); font-weight:800; font-size:28px; }
      h1, p { margin:0; }
      .muted { color:var(--muted); font-size:14px; }
      a.btn { display:block; width:100%; box-sizing:border-box; padding:14px 16px; border-radius:12px; background:var(--accent); color:var(--ink); font-weight:700; text-decoration:none; }
      a.link { color:var(--accent); }
      ol { text-align:left; margin:0; padding-left:20px; color:var(--muted); font-size:14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">iC</div>
      <h1>iCell for Android</h1>
      <p class="muted">Test build. Sign in with your iConnecto account.</p>
      <a class="btn" href="https://github.com/anisurrahmantanvi/iCell/raw/built-apk/iCell.apk">Download iCell.apk</a>
      <ol>
        <li>Open the downloaded file and allow installs from this browser if Android asks.</li>
        <li>If an older iCell is installed, this installs over it.</li>
      </ol>
      <p class="muted"><a class="link" href="./">Open the web version</a></p>
    </main>
  </body>
</html>
